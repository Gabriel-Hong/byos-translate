<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BYOS Translate</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <h1>BYOS Translate</h1>
  <p id="bridge" class="status" data-i18n="checkingBridge"></p>
  <p id="fallbackNote" class="hint" data-i18n="machineFallbackNote" hidden></p>
  <button id="toggle" type="button" class="primary" data-i18n="translatePage"></button>
  <p id="pageError" class="error" hidden></p>
  <label><span data-i18n="targetLanguage"></span>
    <select id="targetLang"></select>
  </label>
  <label><span data-i18n="translationEngine"></span>
    <select id="provider"></select>
  </label>
  <label><span data-i18n="model"></span>
    <select id="model"></select>
    <input id="customModel" type="text" data-i18n-placeholder="modelName" autocomplete="off" spellcheck="false" hidden>
  </label>
  <p class="hint"><span data-i18n="shortcut"></span> <kbd>Alt+Q</kbd> · <a href="#" id="openOptions" data-i18n="options"></a></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
