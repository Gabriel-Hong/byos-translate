<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="optionsTitle">BYOS Translate</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="options">
  <h1 data-i18n="optionsTitle"></h1>
  <form id="form">
    <fieldset>
      <legend><span data-i18n="translationEngine"></span> <small data-i18n="savedImmediately"></small></legend>
      <p class="hint" data-i18n="installHint"><code>npm run install-host</code></p>
      <label><span data-i18n="engine"></span>
        <select id="provider"></select>
      </label>
      <label><span data-i18n="model"></span>
        <select id="model"></select>
        <input id="customModel" type="text" data-i18n-placeholder="modelName" autocomplete="off" spellcheck="false" hidden>
      </label>
      <button id="check" type="button" data-i18n="testConnection"></button>
      <span id="checkResult" class="status"></span>
    </fieldset>
    <fieldset>
      <legend data-i18n="translationSection"></legend>
      <label><span data-i18n="targetLanguage"></span>
        <select id="targetLang"></select>
      </label>
      <label><span data-i18n="displayStyle"></span>
        <select id="displayStyle"></select>
      </label>
      <label><span data-i18n="maxSegments"></span>
        <input id="maxSegmentsPerRequest" type="number" min="1" max="40" required>
      </label>
      <label><span data-i18n="maxChars"></span>
        <input id="maxCharsPerRequest" type="number" min="200" max="20000" step="100" required>
      </label>
      <label class="check">
        <input id="machineFallback" type="checkbox">
        <span data-i18n="machineFallbackOption"></span>
      </label>
      <p class="hint" data-i18n="machineFallbackHint"></p>
    </fieldset>
    <button type="submit" class="primary" data-i18n="save"></button>
    <span id="saved" class="status"></span>
  </form>
  <script type="module" src="options.js"></script>
</body>
</html>
