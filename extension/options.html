<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>BYOS Translate 옵션</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="options">
  <h1>BYOS Translate 옵션</h1>
  <form id="form">
    <fieldset>
      <legend>번역 엔진 <small>(바로 저장됩니다)</small></legend>
      <p class="hint">처음 한 번 repo 폴더에서 <code>npm run install-host</code>를 실행하세요.
        고른 엔진의 CLI가 설치되어 있고 로그인되어 있어야 합니다.</p>
      <label>엔진
        <select id="provider"></select>
      </label>
      <label>모델
        <select id="model"></select>
        <input id="customModel" type="text" placeholder="모델 이름" autocomplete="off" spellcheck="false" hidden>
      </label>
      <button id="check" type="button">연결 테스트</button>
      <span id="checkResult" class="status"></span>
    </fieldset>
    <fieldset>
      <legend>번역</legend>
      <label>번역할 언어
        <select id="targetLang"></select>
      </label>
      <label>표시 방식
        <select id="displayStyle"></select>
      </label>
      <label>요청당 최대 문단 수
        <input id="maxSegmentsPerRequest" type="number" min="1" max="40" required>
      </label>
      <label>요청당 최대 글자 수
        <input id="maxCharsPerRequest" type="number" min="200" max="20000" step="100" required>
      </label>
      <label class="check">
        <input id="machineFallback" type="checkbox">
        AI에 연결할 수 없으면 브라우저 내장 번역으로 번역
      </label>
      <p class="hint">브라우저가 PC 안에서 번역합니다(Chrome은 Google, Edge는 Microsoft 모델). 처음에는 번역 실패 표시를
        한 번 클릭해 언어 모델을 받아야 합니다.</p>
    </fieldset>
    <button type="submit" class="primary">저장</button>
    <span id="saved" class="status"></span>
  </form>
  <script type="module" src="options.js"></script>
</body>
</html>
